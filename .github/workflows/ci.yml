name: DawaLink CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dawaling-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify app and catalogue
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ocr.txt

      - name: Install local OCR engine
        run: |
          sudo apt-get update
          sudo apt-get install --yes tesseract-ocr tesseract-ocr-eng tesseract-ocr-fra tesseract-ocr-ara fonts-dejavu-core

      - name: Install Python dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-ocr.txt

      - name: Compile application
        run: python -m compileall -q app.py assistant_service.py dawaling_core.py scripts tests

      - name: Run unit and OCR checks
        run: python -m unittest discover -s tests -v

      - name: Run catalogue evaluation
        run: python scripts/evaluate.py

  build-deliverables:
    name: Build presentation and report
    needs: verify
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-deliverables.txt

      - name: Install SVG rendering library
        run: |
          sudo apt-get update
          sudo apt-get install --yes libcairo2

      - name: Install build dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-deliverables.txt

      - name: Refresh evaluation artifacts
        run: python scripts/evaluate.py

      - name: Build project deliverables
        run: python scripts/build_deliverables.py

      - name: Publish downloadable artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dawaling-presentation-and-report
          if-no-files-found: error
          path: |
            deliverables/DawaLink_Technical_Presentation.pptx
            deliverables/DawaLink_Technical_Presentation.pdf
            deliverables/DawaLink_Technical_Report.pdf
